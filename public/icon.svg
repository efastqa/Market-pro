<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A1538"/>
      <stop offset="50%" stop-color="#670C26"/>
      <stop offset="100%" stop-color="#400616"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background with Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#qatarGrad)"/>
  
  <!-- Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Background Qatar Dhow Sail Pattern Accent -->
  <path d="M512 120 C 400 240, 300 360, 200 512 L 512 512 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Central Logo Badge / Crest -->
  <g transform="translate(256, 230)">
    <!-- Outer Golden Ring -->
    <circle cx="0" cy="0" r="145" fill="#1e040c" stroke="url(#goldGrad)" stroke-width="7" filter="url(#glow)"/>
    
    <!-- Inner Maroon Circle -->
    <circle cx="0" cy="0" r="130" fill="url(#qatarGrad)"/>

    <!-- Marketplace Bag / Shield / Star Hybrid Symbol -->
    <path d="M-60 -20 L-45 -70 Q0 -95 45 -70 L60 -20 Q70 60 0 95 Q-70 60 -60 -20 Z" fill="#ffffff" opacity="0.08"/>
    
    <!-- Monogram "MP" in Luxury Gold -->
    <text x="0" y="28" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="110" 
          font-weight="900" 
          letter-spacing="-4"
          fill="url(#goldGrad)" 
          text-anchor="middle" 
          dominant-baseline="middle">MP</text>

    <!-- Star Accent -->
    <polygon points="0,-95 10,-72 34,-72 15,-57 22,-34 0,-48 -22,-34 -15,-57 -34,-72 -10,-72" fill="url(#goldGrad)" transform="translate(0, 15) scale(0.4)"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#ffffff" 
        text-anchor="middle">MARKETPRO</text>

  <text x="256" y="458" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="6" 
        fill="url(#goldGrad)" 
        text-anchor="middle">QATAR • قطر</text>
</svg>
